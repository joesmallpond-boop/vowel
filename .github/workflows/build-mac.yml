name: macOS build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal - Intel + Apple Silicon)"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Engine tests
        run: ./build/vw_tests | tee test-results.txt

      - name: Real-time timing on a synthetic chord render
        run: |
          python3 - <<'EOF'
          import math, struct
          sr=48000; n=sr*8; out=bytearray()
          ph=0.0
          for i in range(n):
              f=196*2**(0.3/12*math.sin(2*math.pi*5.5*i/sr)); ph+=f/sr
              s=0.3*sum(math.sin(2*math.pi*k*ph)/k for k in range(1,12))
              out+=struct.pack('<h',int(max(-1,min(1,s))*32767))
          hdr=b'RIFF'+struct.pack('<I',36+len(out))+b'WAVEfmt '+struct.pack('<IHHIIHH',16,1,1,sr,sr*2,2,16)+b'data'+struct.pack('<I',len(out))
          open('sweep.wav','wb').write(hdr+out)
          EOF
          ./build/vw_render sweep.wav out.wav --chords "0:55,59,62,67;4:57,60,64,69" --timing --block 64 | tee -a test-results.txt

      - name: pluginval (strictness 10)
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          for p in build/VowelWorm_artefacts/Release/VST3/VowelWorm.vst3 "build/VowelWormInst_artefacts/Release/VST3/VowelWorm Inst.vst3"; do
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests "$p" | tail -3 | tee -a test-results.txt
          done

      - name: Max external + Max for Live device
        run: |
          git clone --depth 1 https://github.com/Cycling74/max-sdk-base.git ../max-sdk-base
          cmake -S "Max/vowelworm~" -B build-max -DCMAKE_BUILD_TYPE=Release -DMAX_SDK_BASE="$PWD/../max-sdk-base" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build-max --config Release
          ./build/vw_paramdump > build/params.json
          mkdir -p dist/VowelWorm-M4L/externals dist/VowelWorm-M4L/javascript
          python3 Tools/make_amxd.py build/params.json dist/VowelWorm-M4L/VowelWorm.amxd
          cp -R "build-max/externals/vowelworm~.mxo" dist/VowelWorm-M4L/externals/
          codesign --force --deep --sign - "dist/VowelWorm-M4L/externals/vowelworm~.mxo"
          lipo -info "dist/VowelWorm-M4L/externals/vowelworm~.mxo/Contents/MacOS/vowelworm~" | tee -a test-results.txt
          cp Max/package/javascript/vw_display.js dist/VowelWorm-M4L/javascript/
          cp Max/package/package-info.json Max/package/install_m4l.command Max/README.md dist/VowelWorm-M4L/

      - name: Package
        run: |
          mkdir -p dist/VowelWorm
          for b in build/*_artefacts/Release/VST3/*.vst3 build/*_artefacts/Release/AU/*.component build/VowelWorm_artefacts/Release/Standalone/*.app; do
            codesign --force --deep --sign - "$b"
            cp -R "$b" dist/VowelWorm/
          done
          cp docs/INSTALL_MAC.txt dist/VowelWorm/README-INSTALL.txt
          cp test-results.txt dist/VowelWorm/
          cp -R dist/VowelWorm-M4L "dist/VowelWorm/Max for Live"
          hdiutil create -volname VowelWorm -srcfolder dist/VowelWorm -ov -format UDZO dist/VowelWorm-macOS.dmg
          (cd dist && zip -qry VowelWorm-macOS.zip VowelWorm)

      - name: Installer package (.pkg)
        run: |
          scripts/make_pkg.sh dist/VowelWorm 0.2.0
          cp docs/INSTALL_MAC.txt dist/INSTALL_MAC.txt

      - name: Test-install the package on this runner
        run: |
          sudo installer -pkg dist/VowelWorm-Installer.pkg -target / | tee -a test-results.txt
          for f in "/Library/Audio/Plug-Ins/VST3/VowelWorm.vst3" "/Library/Audio/Plug-Ins/VST3/VowelWorm Inst.vst3" \
                   "/Library/Audio/Plug-Ins/Components/VowelWorm.component" "/Applications/VowelWorm.app" \
                   "/Users/Shared/Max 9/Packages/VowelWorm/externals/vowelworm~.mxo" "/Users/Shared/Max 8/Packages/VowelWorm/javascript/vw_display.js" \
                   "/Users/Shared/Max 9/Packages/VowelWorm/VowelWorm.amxd"; do
            if [ -e "$f" ]; then echo "installed: $f"; else echo "MISSING: $f"; exit 1; fi
          done | tee -a test-results.txt
          auval -a 2>/dev/null | grep -i vowel | tee -a test-results.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: VowelWorm-macOS
          path: |
            dist/VowelWorm-Installer.pkg
            dist/VowelWorm-macOS.dmg
            dist/VowelWorm-macOS.zip
            test-results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VowelWorm-Installer
          path: dist/VowelWorm-Installer.pkg

      - name: Publish "latest" release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/VowelWorm-Installer.pkg dist/VowelWorm-macOS.dmg \
            --title "VowelWorm (latest build)" --prerelease --target "$GITHUB_SHA" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Download **VowelWorm-Installer.pkg**, then right-click > Open (unsigned build). Installs VST3, AU, Standalone and the Max for Live device; deselect any you don't want under Customise. Not yet tested inside Ableton Live - see docs/TESTING.md."
